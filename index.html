<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inner Loop</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet"> <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #111; /* Dark background */
            margin: 0;
            font-family: 'VT323', monospace; /* Apply pixel font */
            color: #eee;
            overflow: hidden; /* Prevent scrollbars */
            flex-direction: column; /* Stack canvas and text */
        }
        canvas {
            border: 1px solid #555; /* Subtle border */
            background-color: #222; /* Slightly lighter dark background for canvas */
            display: block; /* Prevent extra space below canvas */
            max-width: 100%; /* Ensure canvas scales down */
            max-height: 80vh; /* Limit canvas height */
            aspect-ratio: 16 / 9; /* Maintain aspect ratio */
            image-rendering: pixelated; /* Keep pixels sharp when scaling */
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }
        #message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: #ff4444; /* Reddish text for unsettling messages */
            padding: 20px 40px;
            border-radius: 5px;
            font-size: 2em;
            text-align: center;
            display: none; /* Hidden by default */
            z-index: 10;
            border: 1px solid #ff4444;
        }
        #info-text {
            margin-top: 15px;
            font-size: 1.2em;
            color: #aaa;
            text-align: center;
        }
         /* Basic button styling */
        button {
            background-color: #444;
            border: 1px solid #777;
            color: #eee;
            padding: 8px 15px;
            margin: 5px;
            cursor: pointer;
            font-family: 'VT323', monospace;
            font-size: 1.1em;
            border-radius: 3px;
            transition: background-color 0.2s ease;
        }
        button:hover {
            background-color: #555;
        }
        button:active {
            background-color: #333;
        }
        #controls {
            margin-top: 10px;
            display: flex; /* Use flexbox for button layout */
            justify-content: center; /* Center buttons horizontally */
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="message-box"></div>
    <div id="info-text">Use Arrow Keys or Buttons to Move & Jump</div>
    <div id="controls">
        <button id="leftBtn">&lt; Left</button>
        <button id="jumpBtn">^ Jump</button>
        <button id="rightBtn">Right &gt;</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const messageBox = document.getElementById('message-box');
        const infoText = document.getElementById('info-text');

        // --- Game Configuration ---
        const VIRTUAL_WIDTH = 800; // Internal resolution width
        const VIRTUAL_HEIGHT = 450; // Internal resolution height
        let scale = 1; // Scale factor for rendering

        const GRAVITY = 0.5;
        const JUMP_FORCE = -10;
        const PLAYER_SPEED = 4;
        const PLAYER_WIDTH = 20;
        const PLAYER_HEIGHT = 20;
        const PLATFORM_COLOR = '#888'; // Grey platforms
        const PLAYER_COLOR = '#ff6666'; // Reddish player
        const HAZARD_COLOR = '#55aaff'; // Contrasting blue hazards
        const GOAL_COLOR = '#aaaa66'; // Dim yellow goal

        // --- Game State ---
        let player = {
            x: 50,
            y: VIRTUAL_HEIGHT - 50,
            width: PLAYER_WIDTH,
            height: PLAYER_HEIGHT,
            dx: 0, // Horizontal velocity
            dy: 0, // Vertical velocity
            onGround: false
        };

        let platforms = [];
        let hazards = [];
        let goal = { x: VIRTUAL_WIDTH - 60, y: 50, width: 30, height: 30, reached: false };

        let keys = {
            left: false,
            right: false,
            up: false
        };

        let currentLevel = 0;
        let gameMessage = "";
        let messageTimer = 0;
        const MESSAGE_DURATION = 120; // Frames (approx 2 seconds at 60fps)

        // --- Level Definitions ---
        // Define levels as arrays of platforms and hazards
        const levels = [
            // Level 0: Introduction
            {
                platforms: [
                    { x: 0, y: VIRTUAL_HEIGHT - 20, width: VIRTUAL_WIDTH, height: 20 }, // Ground
                    { x: 150, y: VIRTUAL_HEIGHT - 80, width: 100, height: 10 },
                    { x: 300, y: VIRTUAL_HEIGHT - 140, width: 100, height: 10 },
                    { x: 450, y: VIRTUAL_HEIGHT - 200, width: 100, height: 10 },
                    { x: 600, y: VIRTUAL_HEIGHT - 260, width: 100, height: 10 },
                    { x: VIRTUAL_WIDTH - 100, y: VIRTUAL_HEIGHT - 350, width: 100, height: 10 }, // Platform near goal
                ],
                hazards: [
                    { x: 200, y: VIRTUAL_HEIGHT - 30, width: 50, height: 10 },
                ],
                goal: { x: VIRTUAL_WIDTH - 60, y: VIRTUAL_HEIGHT - 380, width: 30, height: 30 }, // Goal position for level 0
                startPos: { x: 50, y: VIRTUAL_HEIGHT - 50 },
                message: "Where am I?"
            },
            // Level 1: More Hazards
            {
                platforms: [
                    { x: 0, y: VIRTUAL_HEIGHT - 20, width: 150, height: 20 }, // Start ground
                    { x: 250, y: VIRTUAL_HEIGHT - 80, width: 100, height: 10 },
                    { x: 400, y: VIRTUAL_HEIGHT - 140, width: 100, height: 10 },
                    { x: 550, y: VIRTUAL_HEIGHT - 80, width: 100, height: 10 },
                    { x: VIRTUAL_WIDTH - 150, y: VIRTUAL_HEIGHT - 20, width: 150, height: 20 }, // End ground
                ],
                hazards: [
                    { x: 150, y: VIRTUAL_HEIGHT - 30, width: 100, height: 10 }, // Gap hazard
                    { x: 425, y: VIRTUAL_HEIGHT - 150, width: 50, height: 10 }, // Hazard on platform
                    { x: 650, y: VIRTUAL_HEIGHT - 30, width: VIRTUAL_WIDTH - 800, height: 10 }, // Gap hazard
                ],
                goal: { x: VIRTUAL_WIDTH - 60, y: VIRTUAL_HEIGHT - 50, width: 30, height: 30 },
                startPos: { x: 50, y: VIRTUAL_HEIGHT - 50 },
                message: "It feels familiar..."
            },
            // Level 2: The Loop?
             {
                platforms: [
                    { x: 0, y: VIRTUAL_HEIGHT - 20, width: VIRTUAL_WIDTH, height: 20 }, // Ground looks same as level 0
                    { x: 150, y: VIRTUAL_HEIGHT - 80, width: 100, height: 10 },
                    { x: 300, y: VIRTUAL_HEIGHT - 140, width: 100, height: 10 },
                    { x: 450, y: VIRTUAL_HEIGHT - 200, width: 100, height: 10 },
                    { x: 600, y: VIRTUAL_HEIGHT - 260, width: 100, height: 10 },
                    { x: VIRTUAL_WIDTH - 100, y: VIRTUAL_HEIGHT - 350, width: 100, height: 10 },
                ],
                hazards: [
                     { x: 200, y: VIRTUAL_HEIGHT - 30, width: 50, height: 10 }, // Same hazard
                     { x: 500, y: VIRTUAL_HEIGHT - 210, width: 50, height: 10 }, // New hazard
                ],
                goal: { x: VIRTUAL_WIDTH - 60, y: VIRTUAL_HEIGHT - 380, width: 30, height: 30 },
                startPos: { x: 50, y: VIRTUAL_HEIGHT - 50 },
                message: "Again?"
            },
             // Level 3: Final level looping back to 0
            {
                platforms: [ // Empty level, just a floor
                     { x: 0, y: VIRTUAL_HEIGHT - 20, width: VIRTUAL_WIDTH, height: 20 },
                ],
                hazards: [],
                goal: { x: VIRTUAL_WIDTH / 2 - 15, y: VIRTUAL_HEIGHT - 50, width: 30, height: 30 }, // Goal in the middle
                startPos: { x: 50, y: VIRTUAL_HEIGHT - 50 },
                message: "There is no escape." // This message shows briefly before looping
            }
        ];

        // --- Functions ---

        function showMessage(msg, duration = MESSAGE_DURATION) {
            gameMessage = msg;
            messageTimer = duration;
            messageBox.textContent = msg;
            messageBox.style.display = 'block';
        }

        function hideMessage() {
            messageBox.style.display = 'none';
        }

        function resetPlayer(levelData) {
            player.x = levelData.startPos.x;
            player.y = levelData.startPos.y;
            player.dx = 0;
            player.dy = 0;
            player.onGround = false;
            goal.reached = false;
        }

        function loadLevel(levelIndex) {
            if (levelIndex >= levels.length) {
                currentLevel = 0; // Loop back to the first level
                 showMessage("It starts... again.", MESSAGE_DURATION * 2);
            } else if (levelIndex < 0) {
                 currentLevel = 0; // Should not happen, but safety first
            } else {
                currentLevel = levelIndex;
            }

            const levelData = levels[currentLevel];
            platforms = levelData.platforms;
            hazards = levelData.hazards;
            goal = { ...levelData.goal, reached: false }; // Copy goal data for the level
            resetPlayer(levelData);
            if(levelData.message) {
                showMessage(levelData.message);
            } else {
                hideMessage(); // Hide message if level has none
            }
             // Update info text subtly
            infoText.textContent = `Fragment ${currentLevel + 1}... Use Arrows/Buttons`;

             // Special handling for the "final" looping level message
            if (currentLevel === levels.length - 1) {
                 setTimeout(() => {
                     if (currentLevel === levels.length - 1 && goal.reached) { // Check if still on this level when timeout hits
                         loadLevel(currentLevel + 1); // Trigger the loop after a delay
                     }
                 }, 2000); // 2 second delay before loop
             }
        }

        function resizeCanvas() {
            const aspectRatio = VIRTUAL_WIDTH / VIRTUAL_HEIGHT;
            const parentWidth = canvas.parentElement.clientWidth;
            const parentHeight = canvas.parentElement.clientHeight * 0.8; // Use 80% of parent height

            let newWidth = parentWidth;
            let newHeight = newWidth / aspectRatio;

            if (newHeight > parentHeight) {
                newHeight = parentHeight;
                newWidth = newHeight * aspectRatio;
            }

             // Ensure dimensions are integers to avoid blurring
            canvas.width = Math.floor(VIRTUAL_WIDTH);
            canvas.height = Math.floor(VIRTUAL_HEIGHT);
            canvas.style.width = `${Math.floor(newWidth)}px`;
            canvas.style.height = `${Math.floor(newHeight)}px`;

            // Calculate scale for drawing - we draw on the fixed virtual size
            // No scaling needed for drawing since canvas internal size is fixed
            scale = 1; // Set scale to 1 as we draw on the virtual size directly
             ctx.imageSmoothingEnabled = false; // Ensure pixelated look

        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function update() {
            // --- Handle Input ---
            player.dx = 0;
            if (keys.left) {
                player.dx = -PLAYER_SPEED;
            }
            if (keys.right) {
                player.dx = PLAYER_SPEED;
            }
            if (keys.up && player.onGround) {
                player.dy = JUMP_FORCE;
                player.onGround = false;
            }

            // --- Apply Physics ---
            player.dy += GRAVITY;
            player.x += player.dx;
            player.y += player.dy;
            player.onGround = false;

            // --- Collision Detection & Resolution ---

            // Keep player within horizontal bounds
            if (player.x < 0) {
                player.x = 0;
            }
            if (player.x + player.width > VIRTUAL_WIDTH) {
                player.x = VIRTUAL_WIDTH - player.width;
            }

            // Platform collisions
            platforms.forEach(platform => {
                if (checkCollision(player, platform)) {
                    // Check collision from above (landing)
                    if (player.dy > 0 && // Moving down
                        player.y + player.height - player.dy <= platform.y) // Was above platform last frame
                    {
                        player.y = platform.y - player.height;
                        player.dy = 0;
                        player.onGround = true;
                    }
                    // Check collision from below (hitting head)
                    else if (player.dy < 0 && // Moving up
                             player.y - player.dy >= platform.y + platform.height) // Was below platform last frame
                    {
                        player.y = platform.y + platform.height;
                        player.dy = 0;
                    }
                    // Check horizontal collision
                    else {
                         // Colliding from the left side of the platform
                         if (player.dx > 0 && player.x + player.width - player.dx <= platform.x) {
                              player.x = platform.x - player.width;
                              player.dx = 0;
                         }
                         // Colliding from the right side of the platform
                         else if (player.dx < 0 && player.x - player.dx >= platform.x + platform.width) {
                              player.x = platform.x + platform.width;
                              player.dx = 0;
                         }
                    }
                }
            });

            // Hazard collisions
            hazards.forEach(hazard => {
                if (checkCollision(player, hazard)) {
                    // Player hit a hazard, reset level
                    showMessage("Falter...", MESSAGE_DURATION / 2);
                    loadLevel(currentLevel); // Reload current level
                }
            });

             // Goal collision
            if (!goal.reached && checkCollision(player, goal)) {
                goal.reached = true;
                if (currentLevel === levels.length - 1) {
                    // Special handling for the last level message already in loadLevel
                     showMessage("There is no escape."); // Show message immediately
                     // The timeout in loadLevel will handle the actual level loop
                } else {
                    showMessage("Forward?", MESSAGE_DURATION / 2);
                    setTimeout(() => loadLevel(currentLevel + 1), 500); // Load next level after a short delay
                }
            }


            // Fall off screen
            if (player.y > VIRTUAL_HEIGHT) {
                 showMessage("Lost...", MESSAGE_DURATION / 2);
                loadLevel(currentLevel); // Reset current level if player falls off
            }

            // Update message timer
            if (messageTimer > 0) {
                messageTimer--;
                if (messageTimer <= 0) {
                    hideMessage();
                }
            }
        }

        function drawRect(x, y, width, height, color) {
             ctx.fillStyle = color;
             // Use Math.floor to prevent sub-pixel rendering issues
             ctx.fillRect(Math.floor(x * scale), Math.floor(y * scale), Math.floor(width * scale), Math.floor(height * scale));
        }


        function draw() {
            // Clear canvas (using the virtual size)
            ctx.fillStyle = '#222'; // Canvas background color
            ctx.fillRect(0, 0, canvas.width, canvas.height); // Use canvas actual width/height for clearing

            // Draw platforms
            platforms.forEach(platform => {
                drawRect(platform.x, platform.y, platform.width, platform.height, PLATFORM_COLOR);
            });

            // Draw hazards
            hazards.forEach(hazard => {
                drawRect(hazard.x, hazard.y, hazard.width, hazard.height, HAZARD_COLOR);
            });

            // Draw goal
            if (!goal.reached) {
                 drawRect(goal.x, goal.y, goal.width, goal.height, GOAL_COLOR);
                 // Add a subtle flicker/pulse to the goal
                 const pulse = Math.abs(Math.sin(Date.now() * 0.005)); // Slow pulse
                 ctx.fillStyle = `rgba(255, 255, 180, ${0.2 + pulse * 0.3})`; // Faint yellow glow
                 ctx.fillRect(
                    Math.floor((goal.x - 2) * scale),
                    Math.floor((goal.y - 2) * scale),
                    Math.floor((goal.width + 4) * scale),
                    Math.floor((goal.height + 4) * scale)
                 );
            }


            // Draw player
            drawRect(player.x, player.y, player.width, player.height, PLAYER_COLOR);

             // Subtle screen effects for atmosphere (optional)
             if (Math.random() < 0.005) { // Very occasional flicker
                 ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                 ctx.fillRect(0, 0, canvas.width, canvas.height);
             }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop); // Keep the loop going
        }

        // --- Event Listeners ---
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') keys.up = false;
        });

         // Touch controls
        const leftBtn = document.getElementById('leftBtn');
        const rightBtn = document.getElementById('rightBtn');
        const jumpBtn = document.getElementById('jumpBtn');

        leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; }, { passive: false });
        leftBtn.addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; }, { passive: false });
        leftBtn.addEventListener('mousedown', () => keys.left = true); // Also support mouse click
        leftBtn.addEventListener('mouseup', () => keys.left = false);
        leftBtn.addEventListener('mouseleave', () => keys.left = false); // Stop if mouse leaves button while pressed


        rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; }, { passive: false });
        rightBtn.addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; }, { passive: false });
        rightBtn.addEventListener('mousedown', () => keys.right = true);
        rightBtn.addEventListener('mouseup', () => keys.right = false);
        rightBtn.addEventListener('mouseleave', () => keys.right = false);

        jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); keys.up = true; }, { passive: false });
        jumpBtn.addEventListener('touchend', (e) => { e.preventDefault(); keys.up = false; }, { passive: false });
        jumpBtn.addEventListener('mousedown', () => keys.up = true);
        jumpBtn.addEventListener('mouseup', () => keys.up = false);
        // No mouseleave for jump, it's a momentary action

        // Resize listener
        window.addEventListener('resize', resizeCanvas);

        // --- Initialization ---
        window.onload = () => {
            resizeCanvas(); // Initial sizing
            loadLevel(0);   // Load the first level
            gameLoop();     // Start the game loop
        };

    </script>
</body>
</html>
